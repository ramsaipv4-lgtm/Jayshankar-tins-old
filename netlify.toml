# Jayshankar Netlify config.
#
# Decision 29: Vite builds to `dist/`. Hash-router means every URL is
# `/#/...`, so the SPA fallback is `index.html` (not `_redirects`).
# The PWA service worker is generated by `vite-plugin-pwa` and ships
# inside `dist/sw.js` — Netlify's static serving picks it up.
#
# Env vars (set in Netlify UI → Site settings → Environment variables):
#   VITE_SUPABASE_URL              — the project URL, e.g. https://xxxx.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY  — the PUBLISHABLE key (NOT the secret/service_role
#                                    key — that must never ship in the bundle, per
#                                    SPEC §4.1)
#
# The names must match `src/lib/supabase.ts` EXACTLY. It reads
# VITE_SUPABASE_PUBLISHABLE_KEY and throws at startup if it is missing, so a typo
# here (e.g. the older name VITE_SUPABASE_ANON_KEY) builds fine and then shows a
# white screen to the client. Supabase's dashboard calls this key "anon / public" —
# that label is the role, not the variable name.
#
# Build context: production. Node version: 20 (the kit's standing rule).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every URL serves index.html. Defence-in-depth — we use
# HashRouter (in `src/main.tsx`), so the server only ever sees `/` and
# `/index.html` in practice. The redirect is for crawlers / link-previewers
# that strip the hash. See `src/main.tsx` + `src/App.tsx` for the route table.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
